name: Prerelease

on:
  push:
    branches:
      - main
    tags:
      - 'v0.1.0-preview.*'
    paths:
      - 'release/prerelease.json'
      - '.github/workflows/prerelease.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Prerelease tag, for example v0.1.0-preview.2
        required: true
        default: v0.1.0-preview.2

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(jq -r '.tag' release/prerelease.json)"
          fi

          if [[ ! "$TAG" =~ ^v0\.1\.0-preview\.[0-9]+$ ]]; then
            echo "Unsupported prerelease tag: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          PACKAGE_NAME="$(jq -r '.name' package.json)"
          PACKAGE_LICENSE="$(jq -r '.license' package.json)"
          MANIFEST_VERSION="$(jq -r '.version' release/prerelease.json)"
          MANIFEST_TAG="$(jq -r '.tag' release/prerelease.json)"
          MANIFEST_PACKAGE="$(jq -r '.npmPackage' release/prerelease.json)"
          MANIFEST_LICENSE="$(jq -r '.license' release/prerelease.json)"

          for ACTUAL in "$PACKAGE_VERSION" "$MANIFEST_VERSION"; do
            if [[ "$ACTUAL" != "$VERSION" ]]; then
              echo "Release version mismatch: expected $VERSION, found $ACTUAL" >&2
              exit 1
            fi
          done

          if [[ "$MANIFEST_TAG" != "$TAG" ]]; then
            echo "Release tag mismatch: expected $TAG, manifest has $MANIFEST_TAG" >&2
            exit 1
          fi
          if [[ "$PACKAGE_NAME" != "@dihor/gamekit-dice" || "$MANIFEST_PACKAGE" != "$PACKAGE_NAME" ]]; then
            echo "Unexpected npm package name." >&2
            exit 1
          fi
          if [[ "$PACKAGE_LICENSE" != "MIT" || "$MANIFEST_LICENSE" != "MIT" ]]; then
            echo "Prerelease must declare MIT license." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build library
        run: npm run build

      - name: Validate NodeNext consumer
        run: npm run test:consumer

      - name: Build demo
        run: npm run build:demo

      - name: Validate package license files
        shell: bash
        run: |
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          test -f README.md
          test -f CHANGELOG.md
          test "$(jq -r '.license' package.json)" = "MIT"

      - name: Pack npm prerelease
        shell: bash
        run: |
          mkdir -p artifacts/npm
          npm pack --pack-destination artifacts/npm
          PACKAGE="$(find artifacts/npm -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [[ -z "$PACKAGE" ]]; then
            echo "No npm package was produced." >&2
            exit 1
          fi

          test "$(tar -xOf "$PACKAGE" package/package.json | jq -r '.version')" = "${{ steps.version.outputs.version }}"
          test "$(tar -xOf "$PACKAGE" package/package.json | jq -r '.license')" = "MIT"
          tar -tzf "$PACKAGE" > package-files.txt
          grep -q '^package/dist/' package-files.txt
          for FILE in README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md; do
            grep -q "^package/$FILE$" package-files.txt
          done

      - name: Create checksums
        shell: bash
        run: |
          PACKAGE="$(find artifacts/npm -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          PACKAGE_NAME="$(basename "$PACKAGE")"

          (
            cd artifacts/npm
            sha256sum "$PACKAGE_NAME"
          ) > artifacts/SHA256SUMS.txt

          (
            cd artifacts/npm
            sha256sum -c ../SHA256SUMS.txt
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dihor-gamekit-dice-${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error

      - name: Create or update GitHub prerelease
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          TITLE="Dihor.GameKit.Dice $VERSION"
          PACKAGE="$(find artifacts/npm -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          PACKAGE_ASSET="$(basename "$PACKAGE")"
          RELEASE_ASSETS=("$PACKAGE" artifacts/SHA256SUMS.txt)
          EXPECTED_ASSETS=("$PACKAGE_ASSET" "SHA256SUMS.txt")

          if gh release view "$TAG" >/dev/null 2>&1; then
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' \
              | grep -Fxq "$PACKAGE_ASSET"; then
              echo "Existing release $TAG is missing expected package asset $PACKAGE_ASSET." >&2
              echo "Refusing to replace a published tag's package with bytes built from another commit." >&2
              exit 1
            fi

            mkdir -p artifacts/published
            gh release download "$TAG" \
              --pattern "$PACKAGE_ASSET" \
              --dir artifacts/published \
              --clobber

            PUBLISHED_PACKAGE="artifacts/published/$PACKAGE_ASSET"
            RELEASE_DIGEST="$(
              gh release view "$TAG" --json assets \
                --jq ".assets[] | select(.name == \"$PACKAGE_ASSET\") | .digest"
            )"
            PUBLISHED_DIGEST="sha256:$(sha256sum "$PUBLISHED_PACKAGE" | cut -d' ' -f1)"

            if [[ "$RELEASE_DIGEST" != "$PUBLISHED_DIGEST" ]]; then
              echo "Published package digest does not match GitHub release metadata." >&2
              echo "Expected: $RELEASE_DIGEST" >&2
              echo "Actual:   $PUBLISHED_DIGEST" >&2
              exit 1
            fi

            (
              cd artifacts/published
              sha256sum "$PACKAGE_ASSET"
            ) > artifacts/SHA256SUMS.txt

            (
              cd artifacts/published
              sha256sum -c ../SHA256SUMS.txt
            )

            gh release view "$TAG" --json body --jq '.body' > release-notes.md
            sed -i \
              -e 's#PawelWielga/PartyBeam\.DiceKit#PawelWielga/Dihor.GameKit.Dice#g' \
              -e 's#PartyBeam\.DiceKit#Dihor.GameKit.Dice#g' \
              release-notes.md

            gh release edit "$TAG" \
              --title "$TITLE" \
              --prerelease \
              --notes-file release-notes.md

            while IFS= read -r ASSET; do
              KEEP=false
              for EXPECTED in "${EXPECTED_ASSETS[@]}"; do
                if [[ "$ASSET" == "$EXPECTED" ]]; then
                  KEEP=true
                  break
                fi
              done

              if [[ "$KEEP" == "false" ]]; then
                echo "Removing stale release asset: $ASSET"
                gh release delete-asset "$TAG" "$ASSET" --yes
              fi
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')

            # Preserve the published package bytes for an existing tag. Only checksum
            # metadata is refreshed after stale assets and legacy naming are cleaned.
            gh release upload "$TAG" artifacts/SHA256SUMS.txt --clobber

            FINAL_DIGEST="$(
              gh release view "$TAG" --json assets \
                --jq ".assets[] | select(.name == \"$PACKAGE_ASSET\") | .digest"
            )"
            if [[ "$FINAL_DIGEST" != "$RELEASE_DIGEST" ]]; then
              echo "Existing release package digest changed during metadata cleanup." >&2
              exit 1
            fi
          elif git rev-parse "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "${RELEASE_ASSETS[@]}" \
              --prerelease \
              --generate-notes \
              --title "$TITLE"
          else
            gh release create "$TAG" "${RELEASE_ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --generate-notes \
              --title "$TITLE"
          fi

          test "$(gh release view "$TAG" --json name --jq '.name')" = "$TITLE"
          test "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')" = "true"

          mapfile -t ACTUAL_ASSETS < <(
            gh release view "$TAG" --json assets --jq '.assets[].name' | sort
          )
          mapfile -t SORTED_EXPECTED_ASSETS < <(
            printf '%s\n' "${EXPECTED_ASSETS[@]}" | sort
          )

          if [[ "${ACTUAL_ASSETS[*]}" != "${SORTED_EXPECTED_ASSETS[*]}" ]]; then
            echo "Unexpected release asset set." >&2
            printf 'Expected: %s\n' "${SORTED_EXPECTED_ASSETS[*]}" >&2
            printf 'Actual:   %s\n' "${ACTUAL_ASSETS[*]}" >&2
            exit 1
          fi
