name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Build library
        run: npm run build

      - name: Validate NodeNext consumer
        run: npm run test:consumer

      - name: Build demo
        run: npm run build:demo

      - name: Browser smoke tests
        run: npm run test:browser

      - name: Validate npm package
        shell: bash
        run: |
          mkdir -p artifacts/npm
          npm pack --pack-destination artifacts/npm
          PACKAGE="$(find artifacts/npm -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$PACKAGE"
          test "$(tar -xOf "$PACKAGE" package/package.json | jq -r '.version')" = "0.1.0-preview.1"
          test "$(tar -xOf "$PACKAGE" package/package.json | jq -r '.license')" = "MIT"
          tar -tzf "$PACKAGE" > package-files.txt
          grep -q '^package/dist/' package-files.txt
          for FILE in README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md; do
            grep -q "^package/$FILE$" package-files.txt
          done

      - name: Upload npm prerelease artifact
        uses: actions/upload-artifact@v4
        with:
          name: dihor-gamekit-dice-${{ github.sha }}
          path: artifacts/npm/*.tgz
          if-no-files-found: error
